<head>

<style>

</head>
<body>
<div class="wrap">
<header><h1>Stranded vs unstranded RNA-seq</h1><p>Two overlapping genes on opposite strands: why stranded RNA-seq keeps their reads and counts apart. 80 seconds.</p></header>
<div class="card">
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Animated explainer comparing unstranded and stranded RNA-seq on two overlapping genes transcribed in opposite directions."></canvas></div>
<div class="controls"><button id="play" type="button">Play</button><input id="scrub" type="range" min="0" max="8000" value="0" aria-label="Timeline position"><span class="time" id="time">0:00 / 1:20</span></div>
</div>
</div>
<script>
(function(){
"use strict";
var W=1920,H=1080,DUR=80;
var NAVY="#070E24",TEAL="#2DD4BF",AMBER="#FFB020",INK="#E8EEFA",MUTE="#8EA0C4",GREYR="#6B7790";
var SANS='-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
var MONO='ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace';
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var GA=1,BASE=1,bgDone=false;
function clamp(v,a,b){a=a===undefined?0:a;b=b===undefined?1:b;return Math.min(b,Math.max(a,v));}

function eio(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;}

function jx(i,t,a){return a*(Math.sin(t*1.3+i*12.9898)+0.6*Math.sin(t*2.7+i*78.233))/1.6;}

function ca(c,a){var h=hex(c);return "rgba("+h[0]+","+h[1]+","+h[2]+","+a+")";}

function A(a){ctx.globalAlpha=clamp(a)*GA;}
function glow(x,y,r,col,a){var g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,ca(col,1));g.addColorStop(1,ca(col,0));A(a);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);}
function line(x1,y1,x2,y2,col,lw,a){A(a===undefined?1:a);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}

function txt(s,x,y,size,col,a,align,weight,font){A(a===undefined?1:a);ctx.fillStyle=col;ctx.font=(weight||500)+" "+size+"px "+(font||SANS);ctx.textAlign=align||"left";ctx.textBaseline="middle";ctx.fillText(s,x,y);}
function leader(x1,y1,x2,y2,s,col,a,size){size=size||26;line(x1,y1,x2,y2,ca(col,.7),2,a);dot(x1,y1,4,col,a);txt(s,x2+(x2>=x1?10:-10),y2,size,col,a,x2>=x1?"left":"right",500);}
function typed(s,t,a,b){return s.slice(0,Math.floor(s.length*eo(sm(t,a,b))+0.001));}
function cam(keys,t){var n=keys.length,a,b,p;if(t<=keys[0][0]){return {x:keys[0][1],y:keys[0][2],z:keys[0][3]};}
  for(var i=0;i<n-1;i++){a=keys[i];b=keys[i+1];if(t<=b[0]){p=sm(t,a[0],b[0]);p=b[4]==="b"?ebk(p):eio(p);return {x:lerp(a[1],b[1],p),y:lerp(a[2],b[2],p),z:Math.exp(lerp(Math.log(a[3]),Math.log(b[3]),p))};}}
  var l=keys[n-1];return {x:l[1],y:l[2],z:l[3]};}
var BGL=[];(function(){var R=rng(3);[[70,.12,1,2.2,.3,6],[34,.3,2,4.2,.22,10],[9,.7,18,50,.06,16]].forEach(function(L){var a=[];for(var i=0;i<L[0];i++){a.push({x:R()*W,y:R()*H,r:L[2]+R()*(L[3]-L[2]),ph:R()*6.28});}BGL.push({k:L[1],a:a,al:L[4],sp:L[5]});});})();

  var g=ctx.createRadialGradient(960,470,80,960,540,1300);g.addColorStop(0,"#0E1C44");g.addColorStop(1,"#050A1A");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  BGL.forEach(function(L,li){L.a.forEach(function(p){
    var x=((p.x-(c.x-960)*L.k*1.2+Math.sin(t*0.2+p.ph)*L.sp+t*L.sp*0.3)%W+W)%W,y=((p.y-(c.y-540)*L.k*1.2+Math.cos(t*0.17+p.ph)*L.sp)%H+H)%H;
    if(li===2){var gg=ctx.createRadialGradient(x,y,0,x,y,p.r);gg.addColorStop(0,"rgba(120,160,255,"+L.al+")");gg.addColorStop(1,"rgba(120,160,255,0)");ctx.fillStyle=gg;ctx.fillRect(x-p.r,y-p.r,p.r*2,p.r*2);}
    else{ctx.fillStyle="rgba(150,185,255,"+(L.al*(0.6+0.4*Math.sin(t+p.ph)))+")";ctx.beginPath();ctx.arc(x,y,p.r,0,6.2832);ctx.fill();}
  });});
}
function sub(t,a,b,fi,fo,keys,fn,tzIn,tzOut){
  if(t<a||t>b+fo){return;}
  var gi=fi>0?eio(sm(t,a,a+fi)):1,go=fo>0?1-eio(sm(t,b,b+fo)):1,g=gi*go;if(g<=0.003){return;}

var SKY="#5CC8FF",COR="#FF6A55",PAMB="#FFC85A",MAG="#E83FA6",DARKB="#2F6BFF",LIGHTB="#9CC8FF",ENZ="#9AA4B8";
function enz(x,y,r,rot,a,label,t,seed){
  var n=30,i;A(a);ctx.beginPath();
  for(i=0;i<=n;i++){var th=i/n*6.2832,rad=r*(1+0.07*Math.sin(3*th+seed+t*1.4)+0.05*Math.sin(5*th+seed*2+t));var d=Math.abs(Math.atan2(Math.sin(th-rot),Math.cos(th-rot)));if(d<0.55){rad*=1-0.5*(1-d/0.55);}ctx.lineTo(x+Math.cos(th)*rad,y+Math.sin(th)*rad);}
  ctx.closePath();var g=ctx.createRadialGradient(x-r*.3,y-r*.35,r*.1,x,y,r*1.1);g.addColorStop(0,"#C8CFDE");g.addColorStop(1,"#7D88A3");ctx.fillStyle=g;ctx.fill();ctx.strokeStyle="rgba(235,240,255,.5)";ctx.lineWidth=2;ctx.stroke();
  if(label){txt(label,x,y+r*.05,Math.max(11,r*.42),"#18203A",a,"center",700);}}

/* ------------------------------------------------------------ data */
var YP=500,YM=560,LX0=200,LX1=1720,ZONE=[900,1200];
var GS=[{n:"Gene A",hue:SKY,ex:[[300,420],[520,640],[880,1200]],dir:1,y:YP,ry:YP-48},
        {n:"Gene B",hue:COR,ex:[[640,760],[900,1200],[1500,1620]],dir:-1,y:YM,ry:YM+48}];
var RS=[];
(function(){
  var R=rng(41),i;
  function mk(g,x,zone){RS.push({g:g,x:x,zone:zone,dirU:R()<.5?1:-1});}
  for(i=0;i<9;i++){mk(0,300+R()*90,false);}for(i=0;i<9;i++){mk(0,520+R()*110,false);}
  for(i=0;i<12;i++){mk(0,905+R()*265,true);}
  for(i=0;i<6;i++){mk(1,1505+R()*90,false);}for(i=0;i<6;i++){mk(1,645+R()*90,false);}
  for(i=0;i<12;i++){mk(1,905+R()*265,true);}
  var R2=rng(52);
  RS.forEach(function(r,i){r.cx=220+R2()*1480;r.cy=150+R2()*170;r.ang0=(R2()-.5)*1.2;r.rl=0.6+R2()*2.8;r.sp=i*0.022;});

  RS.forEach(function(r){r.nU=cnt[r.binU+"u"];r.nS=cnt[r.binS+"s"];});

/* ------------------------------------------------------------ locus */
function locus(t,o){

  var la=full?1:sm(t,1.4,2.2);
  txt("5\u2032",172,YP,22,MUTE,la,"center",500);txt("3\u2032",1748,YP,22,MUTE,la,"center",500);txt("3\u2032",172,YM,22,MUTE,la,"center",500);txt("5\u2032",1748,YM,22,MUTE,la,"center",500);

/* ------------------------------------------------------------ act 1 */

    txt("5\u2032",s5,g.ry+(g.dir>0?-26:26),22,g.hue,started*fr,"center",600);txt("3\u2032",s3,g.ry+(g.dir>0?-26:26),22,g.hue,sm(t,12.4,13.0)*(1-sm(t,13.2,13.6))*fr,"center",600);
  });

/* ------------------------------------------------------------ pool */
var FP=[];(function(){var R=rng(61);for(var i=0;i<32;i++){var g=i%2;FP.push({g:g,len:56+R()*34,x1:g?1000+R()*400:520+R()*400,y1:310+R()*410,x2:520+R()*880,y2:310+R()*410,ph:R()*6});}})();

  });

  line(1100,830,1180,830,COR,6,la);arrow(1084,830,-1,9,COR,la);txt("Gene B RNA",1200,830,26,COR,la,"left",600);
