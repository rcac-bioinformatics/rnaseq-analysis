<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>From counts to insight</title>
<style>
:root{--page:#E9EEF3;--ink:#12222E;--muted:#56697A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page:#040915;--ink:#E6F0F7;--muted:#8CA3B5;}}
:root[data-theme="dark"]{--page:#040915;--ink:#E6F0F7;--muted:#8CA3B5;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
*,*::before,*::after{box-sizing:inherit;}
body{margin:0;background:var(--page);color:var(--ink);font-family:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;min-height:100vh;}
.wrap{max-width:1500px;margin:0 auto;padding:16px 16px 24px;}
header,.card{margin:0 auto;width:min(100%, calc((100vh - 150px) * 1.7778));min-width:min(100%,320px);}
header{margin-bottom:10px;}
h1{font-weight:700;font-size:clamp(18px,2.4vw,28px);letter-spacing:-0.01em;margin:0 0 2px;}
header p{margin:0;color:var(--muted);font-size:clamp(12px,1.4vw,15px);}
.card{background:#050A1A;border:1px solid #1B2B55;border-radius:12px;overflow:hidden;}
.stage{position:relative;aspect-ratio:16/9;background:#050A1A;}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;}
.controls{display:flex;align-items:center;gap:14px;padding:10px 18px 12px;background:#0A1430;color:#E6F0F7;}
button{font:inherit;font-weight:500;border:0;cursor:pointer;border-radius:999px;padding:8px 18px;background:#E6F0F7;color:#07131C;min-width:84px;}
button:focus-visible,input:focus-visible{outline:3px solid #2DD4BF;outline-offset:3px;}
input[type=range]{flex:1;accent-color:#2DD4BF;height:24px;}
.time{font-variant-numeric:tabular-nums;color:#8CA3B5;font-size:14px;min-width:100px;text-align:right;}
</style>
</head>
<body>
<div class="wrap">
<header><h1>From counts to insight</h1><p>Downstream RNA-seq analysis: filtering, normalization, PCA, differential expression, volcano plot and heatmap. 90 seconds.</p></header>
<div class="card">
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Animated explainer of downstream RNA-seq analysis, from a count matrix to a PCA plot, a volcano plot and a clustered heatmap."></canvas></div>
<div class="controls"><button id="play" type="button">Play</button><input id="scrub" type="range" min="0" max="9000" value="0" aria-label="Timeline position"><span class="time" id="time">0:00 / 1:30</span></div>
</div>
</div>
<script>
(function(){
"use strict";
var W=1920,H=1080,DUR=90;
var NAVY="#070E24",TEAL="#2DD4BF",AMBER="#FFB020",INK="#E8EEFA",MUTE="#8EA0C4",GREYR="#6B7790";
var SANS='-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
var MONO='ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace';
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");
var GA=1,BASE=1,bgDone=false;
function clamp(v,a,b){a=a===undefined?0:a;b=b===undefined?1:b;return Math.min(b,Math.max(a,v));}
function sm(t,a,b){return clamp((t-a)/(b-a));}
function eio(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;}
function eo(p){return 1-Math.pow(1-p,3);}
function ebk(p){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}
function lerp(a,b,p){return a+(b-a)*p;}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function jx(i,t,a){return a*(Math.sin(t*1.3+i*12.9898)+0.6*Math.sin(t*2.7+i*78.233))/1.6;}
function jy(i,t,a){return a*(Math.sin(t*1.1+i*37.719)+0.6*Math.sin(t*2.3+i*4.581))/1.6;}
function hex(c){return [parseInt(c.substr(1,2),16),parseInt(c.substr(3,2),16),parseInt(c.substr(5,2),16)];}
function ca(c,a){var h=hex(c);return "rgba("+h[0]+","+h[1]+","+h[2]+","+a+")";}
function mixc(a,b,p){var x=hex(a),y=hex(b);return "rgb("+Math.round(lerp(x[0],y[0],p))+","+Math.round(lerp(x[1],y[1],p))+","+Math.round(lerp(x[2],y[2],p))+")";}
function A(a){ctx.globalAlpha=clamp(a)*GA;}
function glow(x,y,r,col,a){var g=ctx.createRadialGradient(x,y,0,x,y,r);g.addColorStop(0,ca(col,1));g.addColorStop(1,ca(col,0));A(a);ctx.fillStyle=g;ctx.fillRect(x-r,y-r,2*r,2*r);}
function line(x1,y1,x2,y2,col,lw,a){A(a===undefined?1:a);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();}
function dot(x,y,r,col,a){A(a===undefined?1:a);ctx.fillStyle=col;ctx.beginPath();ctx.arc(x,y,Math.max(r,0.01),0,6.2832);ctx.fill();}
function ring(x,y,r,col,lw,a){A(a===undefined?1:a);ctx.strokeStyle=col;ctx.lineWidth=lw;ctx.beginPath();ctx.arc(x,y,Math.max(r,0.01),0,6.2832);ctx.stroke();}
function rr(x,y,w,h,r){r=Math.max(0,Math.min(r,w/2,h/2));ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();}
function box(x,y,w,h,r,fill,stroke,a,lw){rr(x,y,w,h,r);if(fill){A(a===undefined?1:a);ctx.fillStyle=fill;ctx.fill();}if(stroke){A(a===undefined?1:a);ctx.strokeStyle=stroke;ctx.lineWidth=lw||2;ctx.stroke();}}
function txt(s,x,y,size,col,a,align,weight,font){A(a===undefined?1:a);ctx.fillStyle=col;ctx.font=(weight||500)+" "+size+"px "+(font||SANS);ctx.textAlign=align||"left";ctx.textBaseline="middle";ctx.fillText(s,x,y);}
function leader(x1,y1,x2,y2,s,col,a,size){size=size||26;line(x1,y1,x2,y2,ca(col,.7),2,a);dot(x1,y1,4,col,a);txt(s,x2+(x2>=x1?10:-10),y2,size,col,a,x2>=x1?"left":"right",500);}
function typed(s,t,a,b){return s.slice(0,Math.floor(s.length*eo(sm(t,a,b))+0.001));}
function cam(keys,t){var n=keys.length,a,b,p;if(t<=keys[0][0]){return {x:keys[0][1],y:keys[0][2],z:keys[0][3]};}
  for(var i=0;i<n-1;i++){a=keys[i];b=keys[i+1];if(t<=b[0]){p=sm(t,a[0],b[0]);p=b[4]==="b"?ebk(p):eio(p);return {x:lerp(a[1],b[1],p),y:lerp(a[2],b[2],p),z:Math.exp(lerp(Math.log(a[3]),Math.log(b[3]),p))};}}
  var l=keys[n-1];return {x:l[1],y:l[2],z:l[3]};}
var BGL=[];(function(){var R=rng(3);[[70,.12,1,2.2,.3,6],[34,.3,2,4.2,.22,10],[9,.7,18,50,.06,16]].forEach(function(L){var a=[];for(var i=0;i<L[0];i++){a.push({x:R()*W,y:R()*H,r:L[2]+R()*(L[3]-L[2]),ph:R()*6.28});}BGL.push({k:L[1],a:a,al:L[4],sp:L[5]});});})();
function drawBG(t,c){
  ctx.setTransform(BASE,0,0,BASE,0,0);ctx.globalAlpha=1;
  var g=ctx.createRadialGradient(960,470,80,960,540,1300);g.addColorStop(0,"#0E1C44");g.addColorStop(1,"#050A1A");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  BGL.forEach(function(L,li){L.a.forEach(function(p){
    var x=((p.x-(c.x-960)*L.k*1.2+Math.sin(t*0.2+p.ph)*L.sp+t*L.sp*0.3)%W+W)%W,y=((p.y-(c.y-540)*L.k*1.2+Math.cos(t*0.17+p.ph)*L.sp)%H+H)%H;
    if(li===2){var gg=ctx.createRadialGradient(x,y,0,x,y,p.r);gg.addColorStop(0,"rgba(120,160,255,"+L.al+")");gg.addColorStop(1,"rgba(120,160,255,0)");ctx.fillStyle=gg;ctx.fillRect(x-p.r,y-p.r,p.r*2,p.r*2);}
    else{ctx.fillStyle="rgba(150,185,255,"+(L.al*(0.6+0.4*Math.sin(t+p.ph)))+")";ctx.beginPath();ctx.arc(x,y,p.r,0,6.2832);ctx.fill();}
  });});
}
function sub(t,a,b,fi,fo,keys,fn,tzIn,tzOut){
  if(t<a||t>b+fo){return;}
  var gi=fi>0?eio(sm(t,a,a+fi)):1,go=fo>0?1-eio(sm(t,b,b+fo)):1,g=gi*go;if(g<=0.003){return;}
  var tz=1;if(tzIn&&gi<1){tz=lerp(tzIn,1,gi);}if(tzOut&&go<1){tz=lerp(tzOut,1,go);}
  var c=cam(keys,t);
  if(!bgDone){bgDone=true;ctx.save();var og=GA;GA=1;drawBG(t,c);GA=og;ctx.restore();}
  ctx.save();ctx.setTransform(BASE,0,0,BASE,0,0);var oldGA=GA;GA=oldGA*g;
  ctx.translate(960,540);ctx.scale(tz,tz);ctx.translate(-960,-540);
  ctx.translate(960,540);ctx.scale(c.z,c.z);ctx.translate(-c.x,-c.y);
  fn(t,c);ctx.restore();GA=oldGA;
}

var CTL="#B6F23E",TRT="#B88CFF",UPC="#FF6A55",DNC="#5CC8FF",NSC="#6B7790",ENZ="#9AA4B8";
function commas(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,",");}
function tick(x,y,s,col,a){line(x-s*0.6,y,x-s*0.15,y+s*0.5,col,4,a);line(x-s*0.15,y+s*0.5,x+s*0.7,y-s*0.5,col,4,a);}
function cross(x,y,s,col,a){line(x-s*0.5,y-s*0.5,x+s*0.5,y+s*0.5,col,4,a);line(x-s*0.5,y+s*0.5,x+s*0.5,y-s*0.5,col,4,a);}
function divc(v){ /* diverging, dark center: v in [-1.6,1.6] */
  var p=clamp(Math.abs(v)/1.6);return v<0?mixc("#141B3D","#3FA9F5",p):mixc("#141B3D","#FF6A55",p);}

/* ------------------------------------------------------------ data */
var NGENE=1200,GENES=[];
(function(){
  var R=rng(5),i;
  for(i=0;i<NGENE;i++){
    var g={i:i};
    if(i<62){g.lfc=1.05+R()*2.2;g.y=1.7+Math.min(g.lfc,3)*1.3+R()*1.3;g.cls=1;}
    else if(i<110){g.lfc=-(1.05+R()*2.0);g.y=1.7+Math.min(-g.lfc,3)*1.3+R()*1.3;g.cls=2;}
    else if(i<135){g.lfc=(R()<.5?1:-1)*(1.1+R()*1.9);g.y=R()*1.15;g.cls=0;}
    else if(i<200){g.lfc=(R()<.5?1:-1)*(0.25+R()*0.6);g.y=1.4+R()*1.8;g.cls=0;}
    else{g.lfc=(R()+R()+R()-1.5)*0.75;g.y=Math.pow(R(),2.2)*1.15;g.cls=0;}
    g.y=Math.min(g.y,7.6);g.tr=R();GENES.push(g);
  }
  GENES.forEach(function(g){g.sig=(g.y>1.3&&Math.abs(g.lfc)>1);});
})();
var NUP=GENES.filter(function(g){return g.sig&&g.lfc>0;}).length,NDN=GENES.filter(function(g){return g.sig&&g.lfc<0;}).length,NNS=NGENE-NUP-NDN;

/* count matrix preview (12 rows) */
var SZ=[18,24,20,29,17,22],MEANSZ=21.67,CXm=[575,725,875,1025,1175,1325],TOPm=290,RHm=46;
var MN=["gene_0012","gene_0045","gene_0102","gene_0233","gene_0310","gene_0334","gene_0418","gene_0455","gene_0521","gene_0587","gene_0640","gene_0702"];
var LOWR=[2,5,7,9],RAW=[],NRM=[],LOGV=[];
(function(){
  var R=rng(9),base=[2400,860,6,5200,120,3,1900,15,780,4,3300,260],eff=[2.6,0.9,1,0.35,1.1,1,1.0,1,2.2,1,0.5,1.0],r,c;
  for(r=0;r<12;r++){RAW.push([]);NRM.push([]);LOGV.push([]);
    for(c=0;c<6;c++){var sf=SZ[c]/MEANSZ,e=c>=3?eff[r]:1,v=Math.round(base[r]*sf*e*(0.88+0.24*R()));RAW[r].push(v);NRM[r].push(Math.round(v/sf));LOGV[r].push(Math.log(v/sf+1)/Math.LN2);}}
})();
var CONDC=[CTL,CTL,CTL,TRT,TRT,TRT],SMP=["C1","C2","C3","T1","T2","T3"];

/* ------------------------------------------------------------ act 1: matrix preprocessing */
function M1(t,c){
  var r,k,i;
  var ma=sm(t,0.4,1.2);
  /* group headers */
  txt("Control",(CXm[0]+CXm[2])/2,216,26,CTL,ma,"center",700);txt("Treated",(CXm[3]+CXm[5])/2,216,26,TRT,ma,"center",700);
  line(CXm[0]-62,234,CXm[2]+62,234,CTL,4,ma);line(CXm[3]-62,234,CXm[5]+62,234,TRT,4,ma);
  for(k=0;k<6;k++){txt(SMP[k],CXm[k],262,22,INK,ma*0.9,"center",600);}
  /* sidebar steps */
  var steps=[["Filter low counts",3.2,8.6],["Normalize depth",8.4,13.8],["Log transform",13.8,18.2]];
  steps.forEach(function(s,j){
    var sa=sm(t,s[1]-0.4,s[1]+0.3),act=(t>=s[1]&&t<s[2]),done=(t>=s[2]);
    var y=430+j*64;
    dot(76,y,16,act?TEAL:(done?"rgba(45,212,191,.25)":"rgba(130,160,230,.18)"),sa);
    if(done){tick(76,y,14,TEAL,sa);}else{txt(String(j+1),76,y+1,20,act?"#07131C":MUTE,sa,"center",700);}
    txt(s[0],106,y,26,act?INK:MUTE,sa,"left",act?700:500);
  });
  /* rows */
  var rp=eio(sm(t,5.2,6.8)),s1=eio(sm(t,10.2,12.0)),s2=eio(sm(t,14.2,16.4)),lowHi=sm(t,3.4,4.2)*(1-sm(t,5.0,5.2));
  for(r=0;r<12;r++){
    var isLow=LOWR.indexOf(r)>=0,rem=0;for(k=0;k<LOWR.length;k++){if(LOWR[k]<r){rem++;}}
    var slot=isLow?r:(r-rp*rem),y=TOPm+slot*RHm+RHm/2,al=ebk(sm(t,0.6+r*0.06,1.2+r*0.06));if(al<=0.01){continue;}al=clamp(al);
    var xo=isLow?eo(rp)*190:0,oa=isLow?(1-eo(rp)):1;
    ctx.save();ctx.translate(xo,0);
    txt(MN[r],480,y,22,MUTE,al*oa,"right",500,MONO);
    if(isLow&&lowHi>0){box(490,y-21,CXm[5]-490+70,42,10,ca("#FFB020",.10*lowHi),"#FFB020",lowHi,3);}
    for(k=0;k<6;k++){
      var base=lerp(RAW[r][k],NRM[r][k],s1),v=lerp(base,LOGV[r][k],s2);
      var dispv=(s2>0.5)?v.toFixed(1):String(Math.round(v));
      box(CXm[k]-68,y-20,136,40,8,"rgba(18,30,70,.72)","rgba(110,140,210,.28)",al*oa,2);
      if(s2>0){var iv=clamp((LOGV[r][k]-1)/11);box(CXm[k]-68,y-20,136,40,8,mixc("#18224E","#6C8CFF",iv),null,al*oa*s2,1);}
      txt((s2>0.5?dispv:commas(Math.round(v))),CXm[k],y+1,24,INK,al*oa,"center",600,MONO);
    }
    ctx.restore();
  }
  /* gene counter */
  var cn=sm(t,3.0,3.8),val=Math.round(lerp(1500,1200,eio(sm(t,5.4,6.8))));
  txt(commas(val),1640,392,76,val<1500?INK:INK,cn,"center",700,MONO);txt("genes",1640,452,28,MUTE,cn,"center",500);
  var rma=sm(t,6.6,7.2)*(1-sm(t,8.4,9.0));txt("300 removed",1640,500,28,"#FFB020",rma,"center",600);
  var tn=sm(t,3.0,3.6);txt("Illustrative subset",1640,312,22,MUTE,tn*0.9,"center",400);
  /* library sizes */
  var la=sm(t,8.6,9.2)*(1-sm(t,14.0,14.8)),eq=eio(sm(t,10.6,12.0));
  if(la>0){txt("Library size",470,150,22,MUTE,la,"right",500);
    for(k=0;k<6;k++){var h=lerp(SZ[k]*2.4,MEANSZ*2.4,eq),bx=CXm[k];box(bx-30,190-h,60,h,6,ca(CONDC[k],.85),null,la,1);
      txt(eq<0.5?(SZ[k]+"M"):"21.7M",bx,190-h-14,20,INK,la,"center",600);
      txt("x"+(MEANSZ/SZ[k]).toFixed(2),bx,170-0,0,INK,0);}
    var sa2=sm(t,9.4,10.2)*(1-sm(t,12.8,13.4));txt("Scale factors x1.20, x0.90, x1.08, x0.75, x1.27, x0.98",960,64,22,MUTE,sa2*la,"center",500);}
}

/* ------------------------------------------------------------ act 2: PCA / MDS */
var PCP=[[-2.1,0.5],[-1.7,-0.6],[-2.4,-0.1],[2.0,0.4],[1.8,-0.7],[2.3,0.2]];
var PGX0=600,PGX1=1320,PGY0=230,PGY1=760;
function pcx(x){return 960+x*(PGX1-PGX0)/6;}
function pcy(y){return 500-y*(PGY1-PGY0)/4;}
function M2(t,c){
  var k,fa=sm(t,18.2,19.0);
  box(PGX0-40,PGY0-30,PGX1-PGX0+80,PGY1-PGY0+60,22,"rgba(12,22,52,.7)","rgba(110,140,210,.4)",fa,2);
  line(pcx(0),PGY0-10,pcx(0),PGY1+10,"rgba(150,175,235,.25)",2,fa);line(PGX0-20,pcy(0),PGX1+20,pcy(0),"rgba(150,175,235,.25)",2,fa);
  var ax=sm(t,21.4,22.2);
  txt("PC1 (62% of variance)",960,PGY1+62,26,INK,ax,"center",600);
  ctx.save();ctx.translate(PGX0-84,500);ctx.rotate(-Math.PI/2);txt("PC2 (14%)",0,0,26,INK,ax,"center",600);ctx.restore();
  txt("PCA (DESeq2) or MDS (limma)",PGX1+40,PGY0-60,22,MUTE,sm(t,19.4,20.2),"right",400);
  /* hulls */
  var ha=eio(sm(t,22.8,24.4));
  [[0,CTL,"Control"],[3,TRT,"Treated"]].forEach(function(g){
    var cx=0,cy=0;for(k=0;k<3;k++){cx+=PCP[g[0]+k][0]/3;cy+=PCP[g[0]+k][1]/3;}
    A(ha*0.12);ctx.fillStyle=g[1];ctx.beginPath();ctx.ellipse(pcx(cx),pcy(cy),170*ha,140*ha,0,0,6.2832);ctx.fill();
    A(ha*0.8);ctx.strokeStyle=g[1];ctx.lineWidth=3;ctx.setLineDash([10,8]);ctx.beginPath();ctx.ellipse(pcx(cx),pcy(cy),170*ha,140*ha,0,0,6.2832);ctx.stroke();ctx.setLineDash([]);
    txt(g[2],pcx(cx),pcy(cy)-172,30,g[1],ha,"center",700);});
  /* dots */
  for(k=0;k<6;k++){
    var t0=19.0+k*0.16,u=eio(sm(t,t0,t0+1.6)),sx=CXm[k],sy=262,ex=pcx(PCP[k][0]),ey=pcy(PCP[k][1]);
    var qx=(sx+ex)/2,qy=Math.min(sy,ey)-160,x=(1-u)*(1-u)*sx+2*(1-u)*u*qx+u*u*ex,y=(1-u)*(1-u)*sy+2*(1-u)*u*qy+u*u*ey;
    var rr_=lerp(16,22,ebk(sm(t,t0+1.2,t0+1.8)));
    if(t<t0-0.2){continue;}
    glow(x,y,46,CONDC[k],0.25*sm(t,t0,t0+0.4));dot(x,y,rr_,CONDC[k],1);ring(x,y,rr_,"rgba(255,255,255,.7)",2,1);
    txt(SMP[k],x+(k<3?-1:1)*34,y-20,22,INK,sm(t,t0+1.0,t0+1.6),k<3?"right":"left",600);
  }
  /* annotations */
  var ba=sm(t,24.8,25.6)*(1-sm(t,28.2,28.8));
  if(ba>0){line(pcx(-1.2),PGY0+30,pcx(1.2),PGY0+30,INK,3,ba);arrowH(pcx(1.2),PGY0+30,1,ba);arrowH(pcx(-1.2),PGY0+30,-1,ba);txt("Condition drives PC1",pcx(0),PGY0+64,28,INK,ba,"center",700);}
