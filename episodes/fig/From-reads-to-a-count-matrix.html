<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<style>

header{margin-bottom:10px;}

.card{background:#050A1A;border:1px solid #1B2B55;border-radius:12px;overflow:hidden;}

</style>
</head>
<body>
<div class="wrap">
<header><h1>From reads to a count matrix</h1><p>Bioinformatics steps of bulk RNA-seq: alignment, counting reads per gene, and the count matrix. 72 seconds.</p></header>
<div class="card">
<div class="stage" id="stage"><canvas id="cv" role="img" aria-label="Animated explainer: sequencing reads align to a reference genome, are counted per gene, and are collected into a count matrix of genes by samples."></canvas></div>
<div class="controls"><button id="play" type="button">Play</button><input id="scrub" type="range" min="0" max="7200" value="0" aria-label="Timeline position"><span class="time" id="time">0:00 / 1:12</span></div>
</div>
</div>
<script>
(function(){
"use strict";
var W=1920,H=1080,DUR=72;
var NAVY="#070E24",TEAL="#2DD4BF",AMBER="#FFB020",INK="#E8EEFA",MUTE="#8EA0C4",GREYR="#6B7790";
var SANS='-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif';
var MONO='ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace';
var cv=document.getElementById("cv"),ctx=cv.getContext("2d");

function clamp(v,a,b){a=a===undefined?0:a;b=b===undefined?1:b;return Math.min(b,Math.max(a,v));}
function sm(t,a,b){return clamp((t-a)/(b-a));}
function eio(p){return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2;}
function eo(p){return 1-Math.pow(1-p,3);}
function ebk(p){var c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);}

  var l=keys[n-1];return {x:l[1],y:l[2],z:l[3]};}
var BGL=[];(function(){var R=rng(3);[[70,.12,1,2.2,.3,6],[34,.3,2,4.2,.22,10],[9,.7,18,50,.06,16]].forEach(function(L){var a=[];for(var i=0;i<L[0];i++){a.push({x:R()*W,y:R()*H,r:L[2]+R()*(L[3]-L[2]),ph:R()*6.28});}BGL.push({k:L[1],a:a,al:L[4],sp:L[5]});});})();

  BGL.forEach(function(L,li){L.a.forEach(function(p){
    var x=((p.x-(c.x-960)*L.k*1.2+Math.sin(t*0.2+p.ph)*L.sp+t*L.sp*0.3)%W+W)%W,y=((p.y-(c.y-540)*L.k*1.2+Math.cos(t*0.17+p.ph)*L.sp)%H+H)%H;
    if(li===2){var gg=ctx.createRadialGradient(x,y,0,x,y,p.r);gg.addColorStop(0,"rgba(120,160,255,"+L.al+")");gg.addColorStop(1,"rgba(120,160,255,0)");ctx.fillStyle=gg;ctx.fillRect(x-p.r,y-p.r,p.r*2,p.r*2);}

/* ------------------------------------------------------------ data */
var GN=[{n:"Gene A",x:140,w:300,hue:"#B6F23E",ex:[[0,90],[150,215],[255,300]]},
{n:"Gene B",x:520,w:240,hue:"#FF6A55",ex:[[0,70],[130,240]]},
{n:"Gene C",x:850,w:330,hue:"#B88CFF",ex:[[0,110],[170,250],[290,330]]},
{n:"Gene D",x:1250,w:280,hue:"#5CC8FF",ex:[[0,100],[160,280]]},
{n:"Gene E",x:1590,w:200,hue:"#FF8AD8",ex:[[0,80],[120,200]]}];
var GC=[14,6,22,3,11],GY=800,RL=34;
var MV=[[14,17,8],[6,5,11],[22,19,30],[3,9,2],[11,12,7]];
var RD=[];
(function(){
  var R=rng(77),gi,k,i;
  for(gi=0;gi<5;gi++){var g=GN[gi],tot=0;g.ex.forEach(function(e){tot+=e[1]-e[0];});

      RD.push({g:gi,kind:"u",parts:[[g.x+ex[0]-10+R()*(ex[1]-ex[0]-14),RL]],hue:g.hue});}}

  [60,455,785,1195,1548].forEach(function(x){RD.push({g:-1,kind:"n",parts:[[x,RL]],hue:GREYR});});
  [[190,1420],[560,1720],[890,1290],[1040,1650]].forEach(function(p){RD.push({g:-1,kind:"m",parts:[[p[0],RL]],x2:p[1],hue:GREYR});});
  var R2=rng(88);
  RD.forEach(function(r,i){r.cx=180+R2()*1560;r.cy=190+R2()*330;r.ang0=(R2()-.5)*1.4;r.tl=10.6+R2()*2.5;r.ts=3.5+i*0.03;
    var p0=r.parts[0],pl=r.parts[r.parts.length-1];r.mid=(p0[0]+pl[0]+pl[1])/2;r.ta=33.9+R2()*1.2;});
  RD.forEach(function(r){r.tsc=30.6+(r.mid-100)/1720*2.4;});
  var segs=[];RD.forEach(function(r,i){var p0=r.parts[0],pl=r.parts[r.parts.length-1];segs.push({i:i,w:0,x0:p0[0],x1:pl[0]+pl[1]});if(r.kind==="m"){segs.push({i:i,w:1,x0:r.x2,x1:r.x2+RL});}});
  segs.sort(function(a,b){return a.x0-b.x0;});var rowEnd=[];
  segs.forEach(function(s){var r=0;while(rowEnd[r]!==undefined&&rowEnd[r]>s.x0-4){r++;}rowEnd[r]=s.x1;if(s.w===0){RD[s.i].row=r;}else{RD[s.i].row2=r;}});
  for(gi=0;gi<5;gi++){var lst=RD.filter(function(r){return r.g===gi;}).sort(function(a,b){return a.mid-b.mid;});lst.forEach(function(r,j){r.k=j;});}
})();
function binCx(g){return GN[g].x+GN[g].w/2;}
function piece(x,y,w,h,col,a,seed){A(a);ctx.fillStyle=col;rr(x,y-h/2,w,h,4);ctx.fill();var kx=x+w*(0.3+0.4*((seed*0.618)%1));ctx.beginPath();ctx.arc(kx,y+h/2+1,3,0,6.2832);ctx.fill();}

  var ga=a;

  for(var x=110;x<1810;x+=40){line(x,GY+8,x,GY+14,"rgba(130,160,230,.35)",2,ga);}
  GN.forEach(function(g,gi){

      box(g.x+ex[0],GY-15,ex[1]-ex[0],30,6,ca(g.hue,al),null,ap);
      if(dim>0.5){glow(g.x+(ex[0]+ex[1])/2,GY,60,g.hue,0.12*ap*dim);}}
    txt(g.n,g.x+g.w/2,GY+48,26,g.hue,ap*lerp(0.7,1,dim),"center",600);
  });
}

  /* FASTQ record */

        x=(1-u)*(1-u)*tx+2*(1-u)*u*qx+u*u*bx0;y=(1-u)*(1-u)*tyy+2*(1-u)*u*qy+u*u*by0;ang=0;}
      var w=lerp(p[1],16,eio(trv)),h=lerp(12,16,eio(trv));
      var yy=y+(r.kind==="n"||r.kind==="m"?eo(rem)*50:0);
      ctx.save();ctx.translate(x,yy);ctx.rotate(ang);piece(-w/2,0,w,h,col,show*al,i);ctx.restore();
      if(r.kind==="m"&&Ll>0.7){var gh=sm(t,r.tl+0.8,r.tl+1.5);var gx=r.x2,gy=rowY(r.row2);A(gh*0.8*al*fade3);ctx.strokeStyle="#9FB0D0";ctx.lineWidth=2;ctx.setLineDash([5,4]);rr(gx,gy-6,RL,12,4);ctx.stroke();ctx.setLineDash([]);
        txt("?",tx,ty-24,20,"#C9D3EA",gh*al*fade3*(1-sm(t,26,27)),"center",700);txt("?",gx+RL/2,gy-24,20,"#C9D3EA",gh*al*fade3*(1-sm(t,26,27)),"center",700);}
    }else{
      for(k=0;k<r.parts.length;k++){var pp=r.parts[k],tx2=pp[0]+pp[1]/2,ox=(k===0?-9:9);

        if(trv>0){var u2=eio(trv),mx=r.mid,bx2=binCx(r.g)-100+14+(r.k%10)*20+8,by2=548-Math.floor(r.k/10)*20,sx=lerp(tx2,mx,0),qx2=(sx+bx2)/2,qy2=Math.min(ty,by2)-90;
          x2=(1-u2)*(1-u2)*tx2+2*(1-u2)*u2*qx2+u2*u2*bx2;y2=(1-u2)*(1-u2)*ty+2*(1-u2)*u2*qy2+u2*u2*by2;}
        var w2=lerp(pp[1],k===0?8:8,eio(trv));
        piece(x2-w2/2,y2,w2,lerp(12,16,eio(trv)),col,show,i+k);}
      var arcA=sm(t,r.tl+0.9,r.tl+1.6)*(1-trv)*fade3;
      if(arcA>0){var a0=r.parts[0][0]+r.parts[0][1],a1=r.parts[1][0];A(arcA*0.9);ctx.strokeStyle=col;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(a0,ty-5);ctx.quadraticCurveTo((a0+a1)/2,ty-26,a1,ty-5);ctx.stroke();}
